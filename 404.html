<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xiao-Tian Xu — redirecting</title>
  <link rel="canonical" href="https://xtxuthomas.github.io/">
  <script>
    const destination = new URL('https://xtxuthomas.github.io/');
    destination.pathname = window.location.pathname;
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination.href);
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=https://xtxuthomas.github.io/"></noscript>
</head>
<body>
  <p>Continue to <a href="https://xtxuthomas.github.io/">Xiao-Tian Xu’s website</a>.</p>
</body>
</html>
